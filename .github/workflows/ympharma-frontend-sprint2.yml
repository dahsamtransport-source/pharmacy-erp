name: YmPharma frontend Sprint 2
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/frontend/**'
      - 'tests/local/**'
      - 'scripts/**'
      - 'sprints/01-database/package*.json'
      - 'package*.json'
      - '*config*'
      - '.github/workflows/ympharma-frontend-sprint2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sprints/01-database --ignore-scripts
      - run: npm run test:local-tools
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
