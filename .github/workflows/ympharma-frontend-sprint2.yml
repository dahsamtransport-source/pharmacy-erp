name: YmPharma frontend Sprint 2
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/frontend/**'
      - 'tests/server/**'
      - 'tests/integration/**'
      - 'tests/local/**'
      - 'scripts/**'
      - 'sprints/01-database/package*.json'
      - 'package*.json'
      - '*config*'
      - '.github/workflows/ympharma-frontend-sprint2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sprints/01-database --ignore-scripts
      - run: npm run test:local-tools
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
  assistant-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sprints/01-database --ignore-scripts
      - run: npm run local:test-assistant
