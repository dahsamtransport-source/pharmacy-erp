name: Mawsil CI

on:
  push:
    branches:
      - 'feat/mawsil-ai-os-mvp'
      - 'mawsil/transaction-core-ai'
  pull_request:
    branches: ['feat/mawsil-ai-os-mvp', 'main']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
