name: Mawsil CI

on:
  push:
    branches:
      - 'feat/mawsil-ai-os-mvp'
      - 'mawsil/transaction-core-ai'
  pull_request:
    branches: ['feat/mawsil-ai-os-mvp', 'main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mawsil_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npm run test:db:postgres
        env:
          MAWSIL_TEST_DATABASE_URL: postgres://postgres:mawsil_ci_only@127.0.0.1:5432/postgres
      - run: npm run build
