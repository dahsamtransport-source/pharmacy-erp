name: Pharma AI Toolkit Static Check
on:
  pull_request:
  push:
    branches: [chore/pharma-ai-agent-toolkit-20261112]
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
      - name: Validate local skills and instructions
        run: python3 .agent-toolkit/verify.py --repo .
